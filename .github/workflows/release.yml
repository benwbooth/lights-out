name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: lights-out
        run: cargo build --release 
      - name: Package
        shell: bash
        run: |
          name="lights-out-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          for bin in lights-out; do
            if [ "$RUNNER_OS" = Windows ]; then cp "lights-out/target/release/$bin.exe" "dist/$name/"; else cp "lights-out/target/release/$bin" "dist/$name/"; fi
          done
          for file in README.md; do [ -f "$file" ] && cp "$file" "dist/$name/"; done
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
